<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Glass UI</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f5f5f5; }
        
        /* 컴팩트 유리 UI 스타일 */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            
            /* 유리 효과는 유지하되 크기 최소화 */
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            
            padding: 12px; /* 패딩 줄임 */
            border-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            user-select: none;
            z-index: 100;
            
            /* 내용물만큼만 크기 잡기 */
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin: 0; /* 마진 제거 */
        }

        input[type=number] { 
            width: 70px; /* 입력창 너비 줄임 */
            padding: 5px; 
            font-size: 16px; 
            font-weight: 700;
            color: #333;
            background: rgba(255, 255, 255, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            text-align: center; 
            outline: none;
        }

        input[type=number]:focus {
            background: #fff;
            border-color: #4455ff;
        }
        
        /* 설명 문구는 마우스 올렸을 때만 보이게 (화면 깔끔하게) */
        .tooltip {
            position: absolute;
            top: 110%; /* 패널 바로 아래 */
            left: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            width: 180px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        #controls:hover .tooltip {
            opacity: 1;
        }

    </style>
    
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="controls">
        <label>공 개수</label>
        <input type="number" id="targetCount" min="0" value="100">
        <div class="tooltip">
            • 드래그: 회전 / 휠: 확대<br>
            • 노란 공 클릭: 3초 후 폭발<br>
            • 숫자 입력 시 자동 생성
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 씬 및 카메라 설정 (기존과 동일)
        // ==========================================
        function createSharpRoomTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const g = ctx.createLinearGradient(0, 0, 0, 512);
            g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cccccc'); 
            ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 512);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(100, 20, 800, 60); 
            ctx.fillStyle = '#eeeeee'; ctx.fillRect(50, 150, 150, 300); ctx.fillRect(820, 150, 150, 300);
            return new THREE.CanvasTexture(canvas);
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 50, 90);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 30;
        controls.maxDistance = 120; 
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 

        scene.environment = createSharpRoomTexture();
        scene.environment.mapping = THREE.EquirectangularReflectionMapping;

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xaaaaaa, 0.7);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(30, 80, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const floorGeo = new THREE.PlaneGeometry(3000, 3000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.0, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const SPAWN_RANGE = 80;

        // ==========================================
        // 2. 공 클래스
        // ==========================================
        const sphereGeo = new THREE.SphereGeometry(1, 24, 24);
        const BALL_RADIUS = 2.0; 
        const BALL_DIAMETER = BALL_RADIUS * 2;
        const RESTITUTION = 0.75; 

        const chromeMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.0, envMapIntensity: 1.0 });
        const darkMaterial = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 1.0, roughness: 0.1, envMapIntensity: 1.0 });
        const goldMaterial = new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 1.0, roughness: 0.05, emissive: 0x000000 });

        let balls = [];

        class Ball {
            constructor(isSpecial = false, pos = null, vel = null) {
                this.isSpecial = isSpecial;
                this.isCaught = false;
                this.markedForDeletion = false;
                
                let mat = isSpecial ? goldMaterial.clone() : (Math.random() > 0.5 ? chromeMaterial : darkMaterial);
                this.mesh = new THREE.Mesh(sphereGeo, mat);
                this.mesh.castShadow = true; this.mesh.receiveShadow = true;
                this.mesh.scale.set(BALL_RADIUS, BALL_RADIUS, BALL_RADIUS);

                if (pos) this.mesh.position.copy(pos);
                else {
                    this.mesh.position.x = (Math.random() - 0.5) * SPAWN_RANGE;
                    this.mesh.position.y = 70 + Math.random() * 40; 
                    this.mesh.position.z = (Math.random() - 0.5) * SPAWN_RANGE; 
                }

                if (vel) { this.velocity = vel; this.gravity = 0.08; }
                else {
                    this.velocity = new THREE.Vector3((Math.random()-0.5)*0.5, 0, (Math.random()-0.5)*0.5);
                    this.gravity = 0.05 + Math.random() * 0.03;
                }
                
                this.rotVel = { x: (Math.random()-0.5)*0.1, z: (Math.random()-0.5)*0.1 };
                this.blinkTimer = 0;
                this.bounceCount = 0;
                this.maxBounces = 3 + Math.floor(Math.random() * 3); 
                scene.add(this.mesh);
            }

            update() {
                if (this.isCaught) {
                    this.blinkTimer += 0.2;
                    const val = (Math.sin(this.blinkTimer) + 1) / 2; 
                    this.mesh.material.emissive.setRGB(val, 0, 0); 
                    this.mesh.rotation.y += 0.1; return; 
                }

                this.velocity.y -= this.gravity;
                this.mesh.position.add(this.velocity);
                this.mesh.rotation.x += this.rotVel.x;
                this.mesh.rotation.z += this.rotVel.z;

                if (this.mesh.position.y - BALL_RADIUS <= 0) {
                    this.mesh.position.y = BALL_RADIUS; 
                    
                    if (Math.abs(this.velocity.y) > 0.4) {
                        this.velocity.y *= -RESTITUTION; 
                        this.bounceCount++;
                    } else {
                        this.velocity.y = 0;
                        this.velocity.x *= 0.9; this.velocity.z *= 0.9;
                        this.bounceCount = this.maxBounces + 1; 
                    }

                    if (this.bounceCount > this.maxBounces && !this.markedForDeletion) {
                        this.markedForDeletion = true;
                        const flash = new THREE.PointLight(0xffffff, 3, 10);
                        flash.position.copy(this.mesh.position);
                        scene.add(flash);
                        setTimeout(() => scene.remove(flash), 50);
                    }
                }
                if (this.mesh.position.y < -50) this.markedForDeletion = true;
            }

            dispose() { scene.remove(this.mesh); if(this.mesh.material.clone) this.mesh.material.dispose(); }
        }

        // ==========================================
        // 3. 충돌 감지
        // ==========================================
        function checkCollisions() {
            const count = balls.length;
            for (let i = 0; i < count; i++) {
                const b1 = balls[i];
                if (b1.isCaught || b1.markedForDeletion) continue;

                for (let j = i + 1; j < count; j++) {
                    const b2 = balls[j];
                    if (b2.isCaught || b2.markedForDeletion) continue;

                    const dx = b2.mesh.position.x - b1.mesh.position.x;
                    const dy = b2.mesh.position.y - b1.mesh.position.y;
                    const dz = b2.mesh.position.z - b1.mesh.position.z;
                    const distSq = dx*dx + dy*dy + dz*dz;
                    const minDist = BALL_DIAMETER; 
                    
                    if (distSq < minDist * minDist) {
                        const distance = Math.sqrt(distSq);
                        const overlap = (minDist - distance) * 0.5;
                        const nx = dx / distance;
                        const ny = dy / distance;
                        const nz = dz / distance;

                        b1.mesh.position.x -= nx * overlap; b1.mesh.position.y -= ny * overlap; b1.mesh.position.z -= nz * overlap;
                        b2.mesh.position.x += nx * overlap; b2.mesh.position.y += ny * overlap; b2.mesh.position.z += nz * overlap;

                        const rvx = b2.velocity.x - b1.velocity.x;
                        const rvy = b2.velocity.y - b1.velocity.y;
                        const rvz = b2.velocity.z - b1.velocity.z;
                        const velAlongNormal = rvx * nx + rvy * ny + rvz * nz;
                        if (velAlongNormal > 0) continue;
                        const impulse = -(1 + RESTITUTION) * velAlongNormal * 0.5;

                        b1.velocity.x -= nx * impulse; b1.velocity.y -= ny * impulse; b1.velocity.z -= nz * impulse;
                        b2.velocity.x += nx * impulse; b2.velocity.y += ny * impulse; b2.velocity.z += nz * impulse;
                    }
                }
            }
        }

        // ==========================================
        // 4. 입력 및 로직
        // ==========================================
        function explodeBig(pos) {
            const flash = new THREE.PointLight(0xffaa00, 10, 30);
            flash.position.copy(pos); scene.add(flash);
            setTimeout(() => scene.remove(flash), 100);
            for(let i=0; i<12; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const speed = 1.5; 
                const vx = speed * Math.sin(phi) * Math.cos(theta);
                const vy = speed * Math.abs(Math.sin(phi) * Math.sin(theta));
                const vz = speed * Math.cos(phi);
                balls.push(new Ball(false, pos, new THREE.Vector3(vx, vy, vz)));
            }
        }

        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
        
        let isDragging = false;
        let startX, startY;
        window.addEventListener('mousedown', (e) => { isDragging = false; startX = e.clientX; startY = e.clientY; });
        window.addEventListener('mousemove', (e) => { if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) isDragging = true; });
        window.addEventListener('mouseup', (e) => {
            if (isDragging) return;
            if (e.target.closest('#controls') || e.target.tagName === 'INPUT') return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);
            for(let item of intersects) {
                const ball = balls.find(b => b.mesh === item.object);
                if(ball) {
                    if(ball.isSpecial && !ball.isCaught) {
                        ball.isCaught = true;
                        setTimeout(() => { if(!ball.markedForDeletion) { explodeBig(ball.mesh.position); ball.markedForDeletion = true; } }, 3000);
                    } else if (!ball.isSpecial && !ball.isCaught) {
                        ball.velocity.y = 1.2; 
                        setTimeout(() => ball.markedForDeletion = true, 150);
                    }
                    break;
                }
            }
        });

        const countInput = document.getElementById('targetCount');
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const targetCount = parseInt(countInput.value) || 0;
            const diff = targetCount - balls.length;

            if (diff > 0) {
                const spawnCount = Math.min(diff, 50); 
                for(let k=0; k<spawnCount; k++) {
                    balls.push(new Ball(Math.random() < 0.05));
                }
            }

            checkCollisions();
            balls.forEach(b => b.update());
            
            for(let i = balls.length - 1; i >= 0; i--) {
                if(balls[i].markedForDeletion) { balls[i].dispose(); balls.splice(i, 1); }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
